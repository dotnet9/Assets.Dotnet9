<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760">
  <defs>
    <marker id="goodArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#2c9a86"/></marker>
    <marker id="badArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#d2675f"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#132b36" flood-opacity=".13"/></filter>
  </defs>
  <rect width="1400" height="760" fill="#f7fafb"/>
  <g font-family="Microsoft YaHei, Segoe UI, sans-serif">
    <text x="70" y="72" font-size="34" font-weight="700" fill="#173743">真正要对齐的是整条渲染依赖链</text>
    <text x="72" y="110" font-size="19" fill="#68818d">单个包的版本看起来正确，不代表组合可以在目标系统上工作</text>
    <g filter="url(#shadow)">
      <rect x="70" y="190" width="230" height="100" rx="16" fill="#e8f5f3" stroke="#4bbcaf" stroke-width="3"/>
      <text x="185" y="232" text-anchor="middle" font-size="23" fill="#16474b">Avalonia</text>
      <text x="185" y="267" text-anchor="middle" font-size="17" fill="#4a7074">UI / 平台适配</text>
      <rect x="390" y="190" width="230" height="100" rx="16" fill="#e8f5f3" stroke="#4bbcaf" stroke-width="3"/>
      <text x="505" y="232" text-anchor="middle" font-size="23" fill="#16474b">SkiaSharp</text>
      <text x="505" y="267" text-anchor="middle" font-size="17" fill="#4a7074">托管绘制绑定</text>
      <rect x="710" y="190" width="230" height="100" rx="16" fill="#fff1dd" stroke="#e9a65b" stroke-width="3"/>
      <text x="825" y="232" text-anchor="middle" font-size="23" fill="#70471c">HarfBuzz</text>
      <text x="825" y="267" text-anchor="middle" font-size="17" fill="#8b653c">文字排版资产</text>
      <rect x="1030" y="190" width="300" height="100" rx="16" fill="#fff1dd" stroke="#e9a65b" stroke-width="3"/>
      <text x="1180" y="232" text-anchor="middle" font-size="23" fill="#70471c">Skia / SVG native assets</text>
      <text x="1180" y="267" text-anchor="middle" font-size="17" fill="#8b653c">RID + 原生 DLL</text>
    </g>
    <path d="M300 240 H380" stroke="#2c9a86" stroke-width="5" marker-end="url(#goodArrow)"/>
    <path d="M620 240 H700" stroke="#2c9a86" stroke-width="5" marker-end="url(#goodArrow)"/>
    <path d="M940 240 H1020" stroke="#2c9a86" stroke-width="5" marker-end="url(#goodArrow)"/>
    <text x="700" y="370" font-size="23" font-weight="700" fill="#2c806f">兼容组合：同一条版本基线</text>
    <path d="M185 305 C185 410 505 410 505 305" stroke="#2c9a86" stroke-width="4" fill="none" marker-end="url(#goodArrow)" opacity=".8"/>
    <path d="M505 305 C505 450 825 450 825 305" stroke="#2c9a86" stroke-width="4" fill="none" marker-end="url(#goodArrow)" opacity=".8"/>
    <path d="M825 305 C825 490 1180 490 1180 305" stroke="#2c9a86" stroke-width="4" fill="none" marker-end="url(#goodArrow)" opacity=".8"/>
    <g filter="url(#shadow)">
      <rect x="95" y="505" width="1210" height="130" rx="20" fill="#ffffff" stroke="#e47770" stroke-width="3"/>
      <text x="140" y="552" font-size="24" font-weight="700" fill="#a64943">常见错误组合</text>
      <text x="140" y="592" font-size="19" fill="#6e5554">Avalonia 的渲染基线 + 单独升级的 SkiaSharp 4.x + 不同版本 HarfBuzz / SVG 资产</text>
      <path d="M1080 540 l35 35 m0 -35 l-35 35" stroke="#d2675f" stroke-width="8" stroke-linecap="round"/>
    </g>
    <text x="70" y="705" font-size="19" fill="#68818d">Native AOT 会更早触发这条链，旧 Windows 会更早暴露加载边界。</text>
  </g>
</svg>
